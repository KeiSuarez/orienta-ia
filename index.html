    <script>
      // En AI Studio, HMR está inactivo en el iframe de desarrollo; filtrar avisos benignos de websocket de Vite
      (function() {
        const _origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && (args[0].includes('[vite] WebSocket') || args[0].includes('WebSocket closed without opened'))) {
            return;
          }
          _origError.apply(console, args);
        };
      })();
    </script>
